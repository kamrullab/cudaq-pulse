<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="702.547" height="279.093" aria-labelledby="title desc" role="img" version="1.1" viewBox="0 0 526.91 209.32"><title id="title">One QEC round with a decoder deadline</title><desc id="desc">Timeline of one round of the distance-3 repetition code, with a lane for each data qubit&apos;s drive line, each ancilla&apos;s readout line and the GPU link. Both ancillas are read out for 400 ns, and their outcomes go to the decoder over the link. The answer is due at 1450.5 ns, and a correction pulse on each data qubit, which plays only if the decoder&apos;s answer or the fallback table says so, starts at that moment.</desc><defs><style type="text/css">*{stroke-linejoin:round;stroke-linecap:butt}</style></defs><g id="figure_1"><g id="patch_1"><path d="M 0 209.32 L 526.91 209.32 L 526.91 0 L 0 0 L 0 209.32 z" style="fill:none"/></g><g id="axes_1"><g id="patch_2"><path d="M 80.62 181.44 L 501.24 181.44 L 501.24 2.88 L 80.62 2.88 L 80.62 181.44 z" style="fill:none"/></g><g id="line2d_1"><path d="M 80.62 40.32 L 501.24 40.32" clip-path="url(#p8cc497bffc)" style="fill:none;stroke:#2c2f33;stroke-width:.8;stroke-linecap:round"/></g><g id="line2d_2"><path d="M 80.62 69.12 L 501.24 69.12" clip-path="url(#p8cc497bffc)" style="fill:none;stroke:#2c2f33;stroke-width:.8;stroke-linecap:round"/></g><g id="line2d_3"><path d="M 80.62 97.92 L 501.24 97.92" clip-path="url(#p8cc497bffc)" style="fill:none;stroke:#2c2f33;stroke-width:.8;stroke-linecap:round"/></g><g id="line2d_4"><path d="M 80.62 126.72 L 501.24 126.72" clip-path="url(#p8cc497bffc)" style="fill:none;stroke:#2c2f33;stroke-width:.8;stroke-linecap:round"/></g><g id="line2d_5"><path d="M 80.62 155.52 L 501.24 155.52" clip-path="url(#p8cc497bffc)" style="fill:none;stroke:#2c2f33;stroke-width:.8;stroke-linecap:round"/></g><g id="line2d_6"><path d="M 80.62 181.44 L 501.24 181.44" clip-path="url(#p8cc497bffc)" style="fill:none;stroke:#2c2f33;stroke-width: