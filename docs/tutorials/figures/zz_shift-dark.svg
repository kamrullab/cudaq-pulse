<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="543.36" height="141.107" aria-labelledby="title desc" role="img" version="1.1" viewBox="0 0 407.52 105.83"><title id="title">A neighbour moves D1&apos;s frequency</title><desc id="desc">D1&apos;s 0-1 frequency with its neighbour X2 in its ground state and excited. Through their 5.69 MHz coupling, exciting X2 moves D1 by -5.94 kHz, the residual ZZ shift.</desc><defs><style type="text/css">*{stroke-linejoin:round;stroke-linecap:butt}</style></defs><g id="figure_1"><g id="patch_1"><path d="M 0 105.83 L 407.52 105.83 L 407.52 0 L 0 0 L 0 105.83 z" style="fill:none"/></g><g id="axes_1"><g id="patch_2"><path d="M 2.88 74.95 L 404.64 74.95 L 404.64 2.88 L 2.88 2.88 L 2.88 74.95 z" style="fill:none"/></g><g id="matplotlib.axis_1"><g id="xtick_1"><g id="line2d_1"><defs><path id="mfe68c2d5a2" d="M 0 0 L 0 3" style="stroke:#5a6066;stroke-width:.8"/></defs><g><use x="48.95" y="74.95" xlink:href="#mfe68c2d5a2" style="fill:#5a6066;stroke:#5a6066;stroke-width:.8"/></g></g><g id="text_1"><text style="font-size:8.5px;font-family:NVIDIA,Arial,Helvetica,sans-serif;text-anchor:middle;fill:#b4bac1" x="48.95" y="87.91" transform="rotate(-0 48.95 87.91)">−8</text></g></g><g id="xtick_2"><g id="line2d_2"><g><use x="110.48" y="74.95" xlink:href="#mfe68c2d5a2" style="fill:#5a6066;stroke:#5a6066;stroke-width:.8"/></g></g><g id="text_2"><text style="font-size:8.5px;font-family:NVIDIA,Arial,Helvetica,sans-serif;text-anchor:middle;fill:#b4bac1" x="110.48" y="87.91" transform="rotate(-0 110.48 87.91)">−6</text></g></g><g id="xtick_3"><g id="line2d_3"><g><use x="172.01" y="74.95" xlink:href="#mfe68c2d5a2" style="fill:#5a6066;stroke:#5a6066;stroke-width:.8"/></g></g><g id="text_3"><text style="font-size:8.5px;font-family:NVIDIA,Arial,Helvetica,sans-serif;text-anchor:middle;fill:#b4bac1" x="172.01" y="87.91" transform="rotate(-0 172.01 87.91)">−4</text></g></g><g id="xtick_4"><g id="line2d_4"><g><use x="233.54" y="74.95" xlink:href="#mfe68c2d5a2" style="fill:#5a6066;stroke:#5a6066;stroke-width:.8"/></g></g><g id="text_4"><text style="font-size:8.5px;font-family:NVIDIA,Arial,Helvetica,sans-serif;text-anchor:middle;fill:#b4bac1" x="233.54" y="87.91" transform="rotate(-0 233.54 87.91)">−2</text></g></g><g id="xtick_5"><g id="line2d_5"><g><use x="295.06" y="74.95" xlink:href="#mfe68c2d5a2" style="fill:#5a6066;stroke:#5a6066;stroke-width:.8"/></g></g><g id="text_5"><text style="font-size:8.5px;font-family:NVIDIA,Arial,Helvetica,sans-serif;text-anchor:middle;fill:#b4bac1" x="295.06" y="87.91" transform="rotate(-0 295.06 87.91)">0</text></g></g><g id="xtick_6"><g id="line2d_6"><g><use x="356.59" y="74.95" xlink:href="#mfe68c2d5a2" style="fill:#5a6066;stroke:#5a6066;stroke-width:.8"/></g></g><g id="text_6"><text style="font-size:8.5px;font-family:NVIDIA,Arial,Helvetica,sans-serif;text-anchor:middle;fill:#b4bac1" x="356.59" y="87.91" transform="rotate(-0 356.59 87.91)">2</text></g></g><g id="text_7"><text style="font-size:9px;font-family:NVIDIA,Arial,Helvetica,sans-serif;text-anchor:middle;fill:#b4bac1" x="203.76" y="100.79" transform="rotate(-0 203.76 100.79)">D1&apos;s 0-1 frequency, from its value with X2 in ground (kHz)</text></g></g><g id="line2d_7"><path d="M 295.06 74.95 L 295.06 26.90" clip-path="url(#p1b10cf1ddd)" style="fill:none;stroke:#76b900;stroke-width:2.2;stroke-linecap:round"/></g><g id="line2d_8"><path d="M 112.45 74.95 L 112.45 26.90" clip-path="url(#p1b10cf1ddd)" style="fill:none;stroke:#8fb8e8;stroke-width:2.2;stroke-linecap:round"/></g><g id="patch_3"><path d="M 2.88 74.95 L 404.64 74.95" style="fill:none;stroke:#5a6066;stroke-width:.8;stroke-linejoin:miter;stroke-linecap:square"/></g><g id="text_8"><text style="font-size:8px;font-family:NVIDIA,Arial,Helvetica,sans-serif;text-anchor:middle;fill:#76b900" x="295.06" y="22.57" transform="rotate(-0 295.06 22.57)">X2 in ground</text></g><g id="text_9"><text style="font-size:8px;font-family:NVIDIA,Arial,Helvetica,s