<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" class="pv-svg pv-dark" role="img" viewBox="0 0 760 232"><title id="title">One program, lowered for the GPU and exported</title><desc id="desc">One program, lowered for the GPU and exported. The kernel as written: pulses, waits and syncs on its lines. It holds 21 operations. QOp writes the pair&apos;s Hamiltonian and the Lindblad terms of its decay. It holds 82 operations. The cuDensityMat dialect is the cuDensityMat API as IR. It holds 122 operations. LLVM IR turns each of its operations into a call into the cuDensityMat runtime. It holds 1641 operations, 88 of them calls into cuDensityMat. From the same Pulse MLIR, the program exports for a controller as 5 events. Only the last steps differ.</desc><style>.pv-svg{--pv-drive:#5b8c00;--pv-q:#3d6fa3;--pv-readout:#c2185b;--pv-classical:#00796b;--pv-text:#1a1a1a;--pv-muted:#5c636a;--pv-grid:#e8e8e8;--pv-rule:#b8bdc2;--pv-panel:rgba(0, 0, 0, 0.03);--pv-on-pill:#ffffff;--pv-page:#ffffff;display:block;width:100%;height:auto;font-family:var(--pst-font-family-base, NVIDIA, Arial, Helvetica, sans-serif)}.pv-svg.pv-dark{--pv-drive:#76b900;--pv-q:#8fb8e8;--pv-readout:#f06292;--pv-classical:#4dd0c4;--pv-text:#eeeeee;--pv-muted:#b4bac1;--pv-grid:#2c2f33;--pv-rule:#5a6066;--pv-panel:rgba(255, 255, 255, 0.04);--pv-on-pill:#0b0b0b;--pv-page:#111111}.pv-svg text{fill:var(--pv-text);font-size:12px}.pv-svg .pv-title{font-weight:600;font-size:12.5px}.pv-hatch,.pv-svg .pv-small,.pv-svg .pv-tiny{fill:var(--pv-muted)}.pv-svg .pv-small{font-size:10px}.pv-svg .pv-tiny{font-size:9px}.pv-svg .pv-drive-text{fill:var(--pv-drive)}.pv-hatch{opacity:.55}.pv-svg .pv-node-text{font-size:10.5px}.pv-flow{stroke:var(--pv-rule);stroke-width:1.5}.pv-stage{fill:var(--pv-page);stroke-width:1.4}.pv-stage.pv-current{fill:var(--pv-panel);stroke-width:3}.pv-stage-drive{stroke:var(--pv-drive)}.pv-stage-q{stroke:var(--pv-q)}.pv-stage-link{stroke:var(--pv-classical)}.pv-svg .pv-q-text{fill:var(--pv-q)}.pv-svg .pv-link-text{fill:var(--pv-classical)}.pv-svg .pv-code{font-family:var(--pst-font-family-monospace, ui-monospace, Menlo, Consolas, monospace)}</style><defs><pattern id="pvh1" width="5" height="5" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="2" height="5" class="pv-hatch"/></pattern></defs><text x="14" y="18" class="pv-title">Controller export: 5 events</text><g class="pv-stages"><path d="M 177.5 71 H 203.5" class="pv-flow"/><path d="M 367 71 H 393" class="pv-flow"/><path d="M 556.5 71 H 582.5" class="pv-flow"/><path d="M 95.75 108 V 148" class="pv-flow"/><g><rect width="163.5" height="74" x="14" y="34" class="pv-stage pv-stage-drive" rx="5"/><text x="23" y="51" class="pv-title pv-drive-text">Pulse MLIR</text><text x="23" y="66" class="pv-tiny pv-code">mlir(&quot;pulse&quot;)</text><text x="23" y="84" class="pv-node-text">21 operations</text><text x="23" y="99" class="pv-tiny">pulse 13 arith 7</text><rect width="163.5" height="74" x="203.5" y="34" class="pv-stage pv-stage-q" rx="5"/><text x="212.5" y="51" class="pv-title pv-q-text">QOp</text><text x="212.5" y="66" class="pv-tiny pv-code">mlir(&quot;qop&quot;)</text><text x="212.5" y="84" class="pv-node-text">82 operations</text><text x="212.5" y="99" class="pv-tiny">qop 61 arith 20</text><rect width="163.5" height="74" x="393" y="34" class="pv-stage pv-stage-q" rx="5"/><text x="402" y="51" class="pv-title pv-q-text">cuDensityMat</text><text x="402" y="66" class="pv-tiny pv-code">mlir(&quot;cudm&quot;)</text><text x="402" y="84" class="pv-node-text">122 operations</text><text x="402" y="99" class="pv-tiny">cudm 87 arith 34</text><rect width="163.5" height="74" x="582.5" y="34" class="pv-stage pv-stage-q" rx="5"/><text x="591.5" y="51" class="pv-title pv-q-text">LLVM IR</text><text x="591.5" y="66" class="pv-tiny pv-code">mlir(&quot;llvm&quot;)</text><text x="591.5" y="84" class="pv-node-text">88 llvm.call</text><text x="591.5" y="99" class="pv-tiny">1641 operations</text><rect width="163.5" height="74" x="14" y="148" class="pv-stage pv-stage-link pv-current" rx="5"/><text x="23" y="165" class="pv-title pv-link-text">controller export</text><text x="23" y="180" class="pv-tiny pv-code">export_to_controller()</text><text x="23" y="198" class="pv-node-text">5 events</text><text x="23" y="213" class="pv-tiny">drive 2 wait 2 sync 1</text><text x="189.5" y="189" class="pv-small">the program a control system plays, from the same Pulse MLIR</text></g></g></svg>