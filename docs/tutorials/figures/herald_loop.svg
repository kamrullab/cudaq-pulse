<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" class="pv-svg" role="img" viewBox="0 0 760 272"><title id="title">Two heralded attempts, then the T state</title><desc id="desc">Two heralded attempts, then the T state. Attempt 1 reads D5 out. The outcome goes to herald on the controller link. herald accepts the shot: no π pulse. Attempt 2 reads D5 out. The outcome goes to herald on the controller link. herald accepts the shot: no π pulse. Y90 and the T gate&apos;s +π/4 frame shift prepare |T⟩. The last readout measures Z. Post-selection keeps the shot. If herald accepts both attempts, no π pulse plays (97.2% of shots). If herald rejects attempt 1 and accepts attempt 2, π 1 plays (2.7% of shots). If herald rejects both attempts, both π pulses play (8.2e-4 of shots). If herald accepts attempt 1 and rejects attempt 2, π 2 plays (3.2e-4 of shots).</desc><style>.pv-svg{--pv-drive:#5b8c00;--pv-q:#3d6fa3;--pv-readout:#c2185b;--pv-classical:#00796b;--pv-text:#1a1a1a;--pv-muted:#5c636a;--pv-grid:#e8e8e8;--pv-rule:#b8bdc2;--pv-panel:rgba(0, 0, 0, 0.03);--pv-on-pill:#ffffff;--pv-page:#ffffff;display:block;width:100%;height:auto;font-family:var(--pst-font-family-base, NVIDIA, Arial, Helvetica, sans-serif)}.pv-svg text{fill:var(--pv-text);font-size:12px}.pv-svg .pv-title{font-weight:600;font-size:12.5px}.pv-svg .pv-lane,.pv-svg .pv-small,.pv-svg .pv-tiny{fill:var(--pv-muted)}.pv-svg .pv-small{font-size:10px}.pv-svg .pv-tiny{font-size:9px}.pv-svg .pv-on-bar,.pv-svg .pv-tiny.pv-on-text{fill:var(--pv-on-pill)}.pv-svg .pv-lane{font-size:10.5px;font-family:var(--pst-font-family-monospace, ui-monospace, Menlo, Consolas, monospace)}.pv-svg .pv-classical-text,.pv-svg .pv-window-text{fill:var(--pv-classical)}.pv-svg .pv-drive-text{fill:var(--pv-drive)}.pv-grid{stroke:var(--pv-grid)}.pv-head{stroke:var(--pv-text);opacity:.6}.pv-svg .pv-halo{paint-order:stroke;stroke:var(--pv-page);stroke-width:3px;stroke-linejoin:round}.pv-hatch{fill:var(--pv-muted);opacity:.55}.pv-ghost{fill:none;stroke:var(--pv-rule)}.pv-ghost.pv-cond{stroke-dasharray:3 2}.pv-fill.pv-drive,.pv-frame{fill:var(--pv-drive)}.pv-fill.pv-readout{fill:var(--pv-readout)}.pv-window{stroke:none}.pv-window-answer,.pv-window-passed{fill:var(--pv-classical);opacity:.16}.pv-window-passed{opacity:.22}.pv-sync{stroke:var(--pv-muted);stroke-dasharray:1 3}.pv-arrow,.pv-due{stroke:var(--pv-classical)}.pv-due{stroke-width:2}.pv-arrow{fill:none;stroke-width:1.4}.pv-arrow-answer{stroke-dasharray:4 2}.pv-track{fill:var(--pv-grid)}.pv-share{fill:var(--pv-classical)}.pv-case-band{fill:transparent}.pv-case-band.pv-current{fill:var(--pv-panel);stroke:var(--pv-rule)}</style><defs><pattern id="pvh2" width="5" height="5" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="2" height="5" class="pv-hatch"/></pattern></defs><text x="14" y="18" class="pv-title">If herald accepts both attempts, no π pulse plays.</text><g class="pv-timeline"><path d="M 132 46 V 140" class="pv-grid"/><text x="132" y="42" class="pv-small" text-anchor="middle">0</text><path d="M 238.07 46 V 140" class="pv-grid"/><text x="238.07" y="42" class="pv-small" text-anchor="middle">200</text><path d="M 344.14 46 V 140" class="pv-grid"/><text x="344.14" y="42" class="pv-small" text-anchor="middle">400</text><path d="M 450.21 46 V 140" class="pv-grid"/><text x="450.21" y="42" class="pv-small" text-anchor="middle">600</text><path d="M 556.28 46 V 140" class="pv-grid"/><text x="556.28" y="42" class="pv-small" text-anchor="middle">800</text><path d="M 662.35 46 V 140" class="pv-grid"/><text x="662.35" y="42" class="pv-small" text-anchor="middle">1000</text><text x="124" y="42" class="pv-small" text-anchor="end">ns</text><text x="124" y="68" class="pv-lane" text-anchor="end">D5 drive</text><text x="124" y="100" class="pv-lane" text-anchor="end">D5 readout</text><text x="124" y="132" class="pv-lane pv-classical-text" text-anchor="end">controller link</text><g><rect width="8.48" height="16" x="305.95" y="120" class="pv-window pv-window-answer"/><rect width="8.48" height="16" x="305.95" y="120" class="pv-window-passed"/><rect width="8.48" height="16" x="513.85" y="120" class="pv-window pv-window-answer"/><rect width="8.48" height="16" x="513.85" y="120" class="pv-window-passed"/><rect width="159.1" height="16" x="132" y="88" class="pv-ghost" rx="1.5"/><rect width="159.1" height="16" x="132" y="88" class="pv-fill pv-readout" rx="1.5"/><text x="211.55" y="100" class="pv-small pv-on-bar" text-anchor="middle">outcome</text><rect width="21.21" height="16" x="318.68" y="56" class="pv-ghost pv-cond" rx="1.5"/><rect width="159.1" height="16" x="339.89" y="88" class="pv-ghost" rx="1.5"/><rect width="159.1" height="16" x="339.89" y="88" class="pv-fill pv-readout" rx="1.5"/><text x="419.45" y="100" class="pv-small pv-on-bar" text-anchor="middle">outcome</text><rect width="21.21" height="16" x="526.58" y="56" class="pv-ghost pv-cond" rx="1.5"/><rect width="21.21" height="16" x="547.79" y="56" class="pv-ghost" rx="1.5"/><rect width="21.21" height="16" x="547.79" y="56" class="pv-fill pv-drive" rx="1.5"/><rect width="159.1" height="16" x="569.01" y="88" class="pv-ghost" rx="1.5"/><rect width="159.1" height="16" x="569.01" y="88" class="pv-fill pv-readout" rx="1.5"/><text x="648.56" y="100" class="pv-small pv-on-bar" text-anchor="middle">Z readout</text><path d="M 291.10 54 V 106" class="pv-sync"/><path d="M 339.89 54 V 106" class="pv-sync"/><path d="M 499.00 54 V 106" class="pv-sync"/><path d="M 547.79 54 V 106" class="pv-sync"/><path d="M 569.01 67 l 5 5 l -5 5 l -5 -5 z" class="pv-frame"/><text x="576.01" y="69" class="pv-small pv-drive-text pv-halo">+π/4</text><path d="M 569.01 54 V 106" class="pv-sync"/><path d="M 318.68 117 V 141" class="pv-due"/><text x="318.68" y="151" class="pv-small pv-classical-text" text-anchor="middle">due 352 ns</text><path d="M 526.58 117 V 141" class="pv-due"/><text x="526.58" y="151" class="pv-small pv-classical-text" text-anchor="middle">due 744 ns</text><path d="M 291.10 96 L 293.22 128" class="pv-arrow pv-arrow-request"/><path d="M 314.44 128 L 318.68 64" class="pv-arrow pv-arrow-answer"/><path d="M 499.00 96 L 501.12 128" class="pv-arrow pv-arrow-request"/><path d="M 522.33 128 L 526.58 64" class="pv-arrow pv-arrow-answer"/><g><text x="262.59" y="117" class="pv-small pv-halo pv-window-text">answer may arrive</text><text x="470.49" y="117" class="pv-small pv-halo pv-window-text">answer may arrive</text><text x="550" y="53" class="pv-small pv-halo">Y90</text></g></g><path class="pv-head"/></g><g class="pv-cases"><text x="14" y="174" class="pv-lane">every case</text><rect width="618" height="18" x="128" y="182" class="pv-case-band pv-current" rx="3"/><text x="132" y="195" class="pv-small">accepts, then accepts: kept</text><rect width="44" height="12" x="342" y="186" class="pv-ghost pv-cond" rx="2"/><text x="364" y="195" class="pv-tiny" text-anchor="middle">π 1</text><rect width="44" height="12" x="394" y="186" class="pv-ghost pv-cond" rx="2"/><text x="416" y="195" class="pv-tiny" text-anchor="middle">π 2</text><rect width="232" height="10" x="454" y="187" class="pv-track"/><rect width="225.49" height="10" x="454" y="187" class="pv-share"/><text x="692" y="195" class="pv-small">97.2%</text><rect width="618" height="18" x="128" y="202" class="pv-case-band" rx="3"/><text x="132" y="215" class="pv-small">rejects, then accepts: kept</text><rect width="44" height="12" x="342" y="206" class="pv-fill pv-drive" rx="2"/><text x="364" y="215" class="pv-tiny pv-on-text" text-anchor="middle">π 1</text><rect width="44" height="12" x="394" y="206" class="pv-ghost pv-cond" rx="2"/><text x="416" y="215" class="pv-tiny" text-anchor="middle">π 2</text><rect width="232" height="10" x="454" y="207" class="pv-track"/><rect width="6.24" height="10" x="454" y="207" class="pv-share"/><text x="692" y="215" class="pv-small">2.7%</text><rect width="618" height="18" x="128" y="222" class="pv-case-band" rx="3"/><text x="132" y="235" class="pv-small">rejects, then rejects: dropped</text><rect width="44" height="12" x="342" y="226" class="pv-fill pv-drive" rx="2"/><text x="364" y="235" class="pv-tiny pv-on-text" text-anchor="middle">π 1</text><rect width="44" height="12" x="394" y="226" class="pv-fill pv-drive" rx="2"/><text x="416" y="235" class="pv-tiny pv-on-text" text-anchor="middle">π 2</text><rect width="232" height="10" x="454" y="227" class="pv-track"/><rect width="1" height="10" x="454" y="227" class="pv-share"/><text x="692" y="235" class="pv-small">8.2e-4</text><rect width="618" height="18" x="128" y="242" class="pv-case-band" rx="3"/><text x="132" y="255" class="pv-small">accepts, then rejects: dropped</text><rect width="44" height="12" x="342" y="246" class="pv-ghost pv-cond" rx="2"/><text x="364" y="255" class="pv-tiny" text-anchor="middle">π 1</text><rect width="44" height="12" x="394" y="246" class="pv-fill pv-drive" rx="2"/><text x="416" y="255" class="pv-tiny pv-on-text" text-anchor="middle">π 2</text><rect width="232" height="10" x="454" y="247" class="pv-track"/><rect width="1" height="10" x="454" y="247" class="pv-share"/><text x="692" y="255" class="pv-small">3.2e-4</text><text x="454" y="174" class="pv-small">share of shots</text></g></svg>