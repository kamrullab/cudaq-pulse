<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" class="pv-svg pv-dark" role="img" viewBox="0 0 760 196"><title id="title">What post-selection keeps</title><desc id="desc">What post-selection keeps. Every shot starts in D5&apos;s thermal mixture. The herald readout splits the shots: it reads 0 on 97.2%, 1 on 2.7%, 2 on 7.5e-4. Post-selection keeps the branches herald accepts, the 97.2% that read 0. The rest are dropped. Of the kept shots, Z reads 0 on 49.1% and 1 or 2 on 48.1%, as |T⟩ gives.</desc><style>.pv-svg{--pv-drive:#5b8c00;--pv-q:#3d6fa3;--pv-readout:#c2185b;--pv-classical:#00796b;--pv-text:#1a1a1a;--pv-muted:#5c636a;--pv-grid:#e8e8e8;--pv-rule:#b8bdc2;--pv-panel:rgba(0, 0, 0, 0.03);--pv-on-pill:#ffffff;--pv-page:#ffffff;display:block;width:100%;height:auto;font-family:var(--pst-font-family-base, NVIDIA, Arial, Helvetica, sans-serif)}.pv-svg.pv-dark{--pv-drive:#76b900;--pv-q:#8fb8e8;--pv-readout:#f06292;--pv-classical:#4dd0c4;--pv-text:#eeeeee;--pv-muted:#b4bac1;--pv-grid:#2c2f33;--pv-rule:#5a6066;--pv-panel:rgba(255, 255, 255, 0.04);--pv-on-pill:#0b0b0b;--pv-page:#111111}.pv-svg text{fill:var(--pv-text);font-size:12px}.pv-svg .pv-title{font-weight:600;font-size:12.5px}.pv-svg .pv-small{fill:var(--pv-muted);font-size:10px}.pv-svg .pv-halo{paint-order:stroke;stroke:var(--pv-page);stroke-width:3px;stroke-linejoin:round}.pv-hatch{fill:var(--pv-muted);opacity:.55}.pv-branch{fill:none;stroke:var(--pv-classical);stroke-linecap:butt;opacity:.85}.pv-branch.pv-dropped{stroke:var(--pv-muted);stroke-dasharray:3 2;opacity:.6}.pv-dot{fill:var(--pv-classical)}.pv-dot.pv-dropped{fill:var(--pv-muted)}.pv-svg .pv-node-text{font-size:10.5px}</style><defs><pattern id="pvh5" width="5" height="5" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="2" height="5" class="pv-hatch"/></pattern></defs><text x="14" y="18" class="pv-title">The tomography reads Z on the kept shots</text><g class="pv-tree"><text x="339" y="40" class="pv-small" text-anchor="middle">herald readout</text><text x="546" y="40" class="pv-small" text-anchor="middle">tomography, kept shots only</text><g><circle cx="132" cy="132.16" r="3.5" class="pv-dot"/><text x="124" y="136.16" class="pv-node-text pv-halo" text-anchor="end">start</text><path stroke-width="10.72" d="M 132 132.16 C 235.5 132.16 235.5 86.33 339 86.33" class="pv-branch"/><circle cx="339" cy="86.33" r="3.5" class="pv-dot"/><text x="339" y="69.47" class="pv-node-text pv-halo" text-anchor="middle">herald read 0: 97.2%</text><path stroke-width="1.26" d="M 132 132.16 C 235.5 132.16 235.5 141.33 339 141.33" class="pv-branch pv-dropped"/><circle cx="339" cy="141.33" r="3.5" class="pv-dot pv-dropped"/><text x="347" y="145.33" class="pv-small pv-halo" text-anchor="start">herald read 1: 2.7%, dropped</text><path stroke-width="1" d="M 132 132.16 C 235.5 132.16 235.5 178 339 178" class="pv-branch pv-dropped"/><circle cx="339" cy="178" r="3.5" class="pv-dot pv-dropped"/><text x="347" y="182" class="pv-small pv-halo" text-anchor="start">herald read 2: 7.5e-4, dropped</text><path stroke-width="5.9" d="M 339 86.33 C 442.5 86.33 442.5 68 546 68" class="pv-branch"/><circle cx="546" cy="68" r="3.5" class="pv-dot"/><text x="554" y="72" class="pv-node-text pv-halo" text-anchor="start">Z reads 0: 49.1%</text><path stroke-width="5.81" d="M 339 86.33 C 442.5 86.33 442.5 104.66 546 104.66" class="pv-branch"/><circle cx="546" cy="104.66" r="3.5" class="pv-dot"/><text x="554" y="108.66" class="pv-node-text pv-halo" text-anchor="start">Z reads 1 or 2: 48.1%</text></g></g></svg>