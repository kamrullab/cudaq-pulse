<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="652.627" height="202.693" aria-labelledby="title desc" role="img" version="1.1" viewBox="0 0 489.47 152.02"><title id="title">A readout on one controller, a correction on another</title><desc id="desc">Timeline of one program on two controllers. Controller 0 reads D1 out; the outcome goes over the feedback link, 40 ns on the link, at most 400 ns in the correction function and 20 ns of feedback, to controller 1, which plays a pulse on D3 only if the qubit read 1, at 561 ns. A sync ties the two controllers&apos; lines at the end of the readout.</desc><defs><style type="text/css">*{stroke-linejoin:round;stroke-linecap:butt}</style></defs><g id="figure_1"><g id="patch_1"><path d="M 0 152.02 L 489.47 152.02 L 489.47 0 L 0 0 L 0 152.02 z" style="fill:none"/></g><g id="axes_1"><g id="patch_2"><path d="M 65.97 124.14 L 486.59 124.14 L 486.59 3.18 L 65.97 3.18 L 65.97 124.14 z" style="fill:none"/></g><g id="line2d_1"><path d="M 65.97 47.82 L 486.59 47.82" clip-path="url(#p61370f7583)" style="fill:none;stroke:#2c2f33;stroke-width:.8;stroke-linecap:round"/></g><g id="line2d_2"><path d="M 65.97 73.74 L 486.59 73.74" clip-path="url(#p61370f7583)" style="fill:none;stroke:#2c2f33;stroke-width:.8;stroke-linecap:round"/></g><g id="line2d_3"><path d="M 65.97 124.14 L 486.59 124.14" clip-path="url(#p61370f7583)" style="fill:none;stroke:#2c2f33;stroke-width:.8;stroke-linecap:round"/></g><g id="matplotlib.axis_1"><g id="xtick_1"><g id="line2d_4"><path d="M 65.97 124.14 L 65.97 3.18" clip-path="url(#p61370f7583)" style="fill:none;stroke:#2c2f33;stroke-width:.8;stroke-linecap:round"/></g><g id="line2d_5"><defs><path id="mfe68c2d5a2" d="M 0 0 L 0 3" style="stroke:#5a6066;stroke-width:.8"/></defs><g><use x="65.97" y="124.14" xlink:href="#mfe68c2d5a2" style="fill:#5a6066;stroke:#5a6066;stroke-width:.8"/></g></g><g id="text_1"><text style="font-size:8.5px;font-family:NVIDIA,Arial,Helvetica,sans-serif;tex