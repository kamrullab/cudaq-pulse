<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" class="pv-svg pv-dark" role="img" viewBox="0 0 760 206"><title id="title">One pulse picks the axis</title><desc id="desc">One pulse picks the axis. X axis: −Y90 turns +X onto Z. The readout gives ⟨X⟩ = 0.71. Y axis: X90 turns +Y onto Z. The readout gives ⟨Y⟩ = 0.71. Z axis: no pulse. The T gate shows as a +π/4 frame shift. The readout gives ⟨Z⟩ = 0.01.</desc><style>.pv-svg{--pv-drive:#5b8c00;--pv-q:#3d6fa3;--pv-readout:#c2185b;--pv-classical:#00796b;--pv-text:#1a1a1a;--pv-muted:#5c636a;--pv-grid:#e8e8e8;--pv-rule:#b8bdc2;--pv-panel:rgba(0, 0, 0, 0.03);--pv-on-pill:#ffffff;--pv-page:#ffffff;display:block;width:100%;height:auto;font-family:var(--pst-font-family-base, NVIDIA, Arial, Helvetica, sans-serif)}.pv-svg.pv-dark{--pv-drive:#76b900;--pv-q:#8fb8e8;--pv-readout:#f06292;--pv-classical:#4dd0c4;--pv-text:#eeeeee;--pv-muted:#b4bac1;--pv-grid:#2c2f33;--pv-rule:#5a6066;--pv-panel:rgba(255, 255, 255, 0.04);--pv-on-pill:#0b0b0b;--pv-page:#111111}.pv-svg text{fill:var(--pv-text);font-size:12px}.pv-svg .pv-title{font-weight:600;font-size:12.5px}.pv-svg .pv-lane,.pv-svg .pv-small{fill:var(--pv-muted)}.pv-svg .pv-small{font-size:10px}.pv-svg .pv-on-bar{fill:var(--pv-on-pill)}.pv-svg .pv-lane{font-size:10.5px;font-family:var(--pst-font-family-monospace, ui-monospace, Menlo, Consolas, monospace)}.pv-svg .pv-drive-text{fill:var(--pv-drive)}.pv-grid{stroke:var(--pv-grid)}.pv-head{stroke:var(--pv-text);opacity:.6}.pv-svg .pv-halo{paint-order:stroke;stroke:var(--pv-page);stroke-width:3px;stroke-linejoin:round}.pv-hatch{fill:var(--pv-muted);opacity:.55}.pv-ghost{fill:none;stroke:var(--pv-rule)}.pv-ghost.pv-was{stroke:var(--pv-muted);stroke-dasharray:1 2;opacity:.8}.pv-fill.pv-drive,.pv-frame{fill:var(--pv-drive)}.pv-fill.pv-readout{fill:var(--pv-readout)}.pv-track{fill:var(--pv-grid)}.pv-share{fill:var(--pv-classical)}.pv-case-band{fill:transparent}.pv-case-band.pv-current{fill:var(--pv-panel);stroke:var(--pv-rule)}</style><defs><pattern id="pvh1" width="5" height="5" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="2" height="5" class="pv-hatch"/></pattern></defs><text x="14" y="18" class="pv-title">Z axis: no pulse, Z is read as it is</text><g class="pv-timeline"><path d="M 132 46 V 108" class="pv-grid"/><text x="132" y="42" class="pv-small" text-anchor="middle">0</text><path d="M 288.87 46 V 108" class="pv-grid"/><text x="288.87" y="42" class="pv-small" text-anchor="middle">100</text><path d="M 445.74 46 V 108" class="pv-grid"/><text x="445.74" y="42" class="pv-small" text-anchor="middle">200</text><path d="M 602.61 46 V 108" class="pv-grid"/><text x="602.61" y="42" class="pv-small" text-anchor="middle">300</text><text x="124" y="42" class="pv-small" text-anchor="end">ns</text><text x="124" y="68" class="pv-lane" text-anchor="end">D5 drive</text><text x="124" y="100" class="pv-lane" text-anchor="end">D5 readout</text><g><rect width="62.74" height="16" x="194.74" y="56" class="pv-ghost pv-was" rx="1.5"/><rect width="470.61" height="16" x="257.49" y="88" class="pv-ghost pv-was" rx="1.5"/><rect width="62.74" height="16" x="132" y="56" class="pv-ghost" rx="1.5"/><rect width="62.74" height="16" x="132" y="56" class="pv-fill pv-drive" rx="1.5"/><text x="163.37" y="68" class="pv-small pv-on-bar" text-anchor="middle">Y90</text><rect width="470.61" height="16" x="194.74" y="88" class="pv-ghost" rx="1.5"/><rect width="470.61" height="16" x="194.74" y="88" class="pv-fill pv-readout" rx="1.5"/><text x="430.05" y="100" class="pv-small pv-on-bar" text-anchor="middle">readout</text><path d="M 194.74 67 l 5 5 l -5 5 l -5 -5 z" class="pv-frame"/><text x="201.74" y="69" class="pv-small pv-drive-text pv-halo">+π/4</text></g><path class="pv-head"/></g><g class="pv-cases"><text x="14" y="128" class="pv-lane">every step</text><rect width="618" height="18" x="128" y="136" class="pv-case-band" rx="3"/><text x="132" y="149" class="pv-small">X axis</text><rect width="336" height="10" x="350" y="141" class="pv-track"/><rect width="287.21" height="10" x="350" y="141" class="pv-share"/><text x="692" y="149" class="pv-small">⟨X⟩ = 0.71</text><rect width="618" height="18" x="128" y="156" class="pv-case-band" rx="3"/><text x="132" y="169" class="pv-small">Y axis</text><rect width="336" height="10" x="350" y="161" class="pv-track"/><rect width="286.97" height="10" x="350" y="161" class="pv-share"/><text x="692" y="169" class="pv-small">⟨Y⟩ = 0.71</text><rect width="618" height="18" x="128" y="176" class="pv-case-band pv-current" rx="3"/><text x="132" y="189" class="pv-small">Z axis</text><rect width="336" height="10" x="350" y="181" class="pv-track"/><rect width="169.64" height="10" x="350" y="181" class="pv-share"/><text x="692" y="189" class="pv-small">⟨Z⟩ = 0.01</text><text x="350" y="128" class="pv-small">shots reading 0</text></g></svg>