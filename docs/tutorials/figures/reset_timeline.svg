<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="640.547" height="148.533" aria-labelledby="title desc" role="img" version="1.1" viewBox="0 0 480.41 111.4"><title id="title">The schedule of the active reset</title><desc id="desc">Timeline of the active reset on D1&apos;s drive and readout lines. A pi/2 pulse, a 300 ns readout, then a pi pulse from 340 to 380 ns that plays only if the readout read 1, and a second readout from 380 ns that starts at the same time either way.</desc><defs><style type="text/css">*{stroke-linejoin:round;stroke-linecap:butt}</style></defs><g id="figure_1"><g id="patch_1"><path d="M 0 111.40 L 480.41 111.40 L 480.41 0 L 0 0 L 0 111.40 z" style="fill:none"/></g><g id="axes_1"><g id="patch_2"><path d="M 56.90 83.52 L 477.53 83.52 L 477.53 2.88 L 56.90 2.88 L 56.90 83.52 z" style="fill:none"/></g><g id="line2d_1"><path d="M 56.90 47.52 L 477.53 47.52" clip-path="url(#pacc0b6a088)" style="fill:none;stroke:#e8e8e8;stroke-width:.8;stroke-linecap:round"/></g><g id="line2d_2"><path d="M 56.90 83.52 L 477.53 83.52" clip-path="url(#pacc0b6a088)" style="fill:none;stroke:#e8e8e8;stroke-width:.8;stroke-linecap:round"/></g><g id="matplotlib.axis_1"><g id="xtick_1"><g id="line2d_3"><path d="M 56.90 83.52 L 56.90 2.88" clip-path="url(#pacc0b6a088)" style="fill:none;stroke:#e8e8e8;stroke-width:.8;stroke-linecap:round"/></g><g id="line2d_4"><defs><path id="m5b935c8b90" d="M 0 0 L 0 3" style="stroke:#b8bdc2;stroke-width:.8"/></defs><g><use x="56.9" y="83.52" xlink:href="#m5b935c8b90" style="fill:#b8bdc2;stroke:#b8bdc2;stroke-width:.8"/></g></g><g id="text_1"><text style="font-size:8.5px;font-family:NVIDIA,Arial,Helvetica,sans-serif;text-anchor:middle;fill:#5c636a" x="56.9" y="96.47" transform="rotate(-0 56.90 96.47)">0</text></g></g><g id="xtick_2"><g id="line2d_5"><path d="M 118.15 83.52 L 118.15 2.88" clip-path="url(#pacc0b6a088)" style="fill:none;stroke:#e8e8e8;stroke-width:.8;stroke-linecap:round"/></g><g id="line2d