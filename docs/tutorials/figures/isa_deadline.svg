<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="646.72" height="279.093" aria-labelledby="title desc" role="img" version="1.1" viewBox="0 0 485.04 209.32"><title id="title">A QEC round with a decoder deadline, on the toy QPU</title><desc id="desc">Timeline of one QEC round on the toy QPU: both syndromes are read at once on the feedline&apos;s two tones, and the request leaves for the decoder at 280 ns. The kernel waits for the answer with a 60 ns timeout, plus the link&apos;s 8 ns back, so it is due at 352 ns. Two flips that play only on the shots that need them start there: the correction and the fallback.</desc><defs><style type="text/css">*{stroke-linejoin:round;stroke-linecap:butt}</style></defs><g id="figure_1"><g id="patch_1"><path d="M 0 209.32 L 485.04 209.32 L 485.04 0 L 0 0 L 0 209.32 z" style="fill:none"/></g><g id="axes_1"><g id="patch_2"><path d="M 61.54 181.44 L 482.16 181.44 L 482.16 2.88 L 61.54 2.88 L 61.54 181.44 z" style="fill:none"/></g><g id="line2d_1"><path d="M 61.54 47.52 L 482.16 47.52" clip-path="url(#p07609d9bf9)" style="fill:none;stroke:#e8e8e8;stroke-width:.8;stroke-linecap:round"/></g><g id="line2d_2"><path d="M 61.54 83.52 L 482.16 83.52" clip-path="url(#p07609d9bf9)" style="fill:none;stroke:#e8e8e8;stroke-width:.8;stroke-linecap:round"/></g><g id="line2d_3"><path d="M 61.54 119.52 L 482.16 119.52" clip-path="url(#p07609d9bf9)" style="fill:none;stroke:#e8e8e8;stroke-width:.8;stroke-linecap:round"/></g><g id="line2d_4"><path d="M 61.54 155.52 L 482.16 155.52" clip-path="url(#p07609d9bf9)" style="fill:none;stroke:#e8e8e8;stroke-width:.8;stroke-linecap:round"/></g><g id="line2d_5"><path d="M 61.54 181.44 L 482.16 181.44" clip-path="url(#p07609d9bf9)" style="fill:none;stroke:#e8e8e8;stroke-width:.8;stroke-linecap:round"/></g><g id="matplotlib.axis_1"><g id="xtick_1"><g id="line2d_6"><path d="M 61.54 181.44 L 61.54 2.88" clip-path="url(#p07609d9bf9)" style="fill:none;stroke:#e8e8e8;stroke-width:.8;s