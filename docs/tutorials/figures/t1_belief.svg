<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" class="pv-svg" role="img" viewBox="0 0 760 250"><title id="title">One readout moves the estimate</title><desc id="desc">One readout moves the estimate. Before any shot, the prior puts T1 at 150 µs. The next wait would be 76.5 µs. Reading 1 after the 50 µs wait: still excited, so the estimate rises to 163 µs. The next wait would be 83.1 µs. Reading 0 after the 50 µs wait: decayed, so it falls to 128 µs. The next wait would be 65.1 µs.</desc><style>.pv-svg{--pv-drive:#5b8c00;--pv-q:#3d6fa3;--pv-readout:#c2185b;--pv-classical:#00796b;--pv-text:#1a1a1a;--pv-muted:#5c636a;--pv-grid:#e8e8e8;--pv-rule:#b8bdc2;--pv-panel:rgba(0, 0, 0, 0.03);--pv-on-pill:#ffffff;--pv-page:#ffffff;display:block;width:100%;height:auto;font-family:var(--pst-font-family-base, NVIDIA, Arial, Helvetica, sans-serif)}.pv-svg text{fill:var(--pv-text);font-size:12px}.pv-svg .pv-title{font-weight:600;font-size:12.5px}.pv-hatch,.pv-svg .pv-lane,.pv-svg .pv-small{fill:var(--pv-muted)}.pv-svg .pv-small{font-size:10px}.pv-svg .pv-lane{font-size:10.5px;font-family:var(--pst-font-family-monospace, ui-monospace, Menlo, Consolas, monospace)}.pv-svg .pv-halo{paint-order:stroke;stroke:var(--pv-page);stroke-width:3px;stroke-linejoin:round}.pv-hatch{opacity:.55}.pv-svg .pv-node-text{font-size:10.5px}.pv-axis{stroke:var(--pv-rule)}.pv-area{fill:var(--pv-drive);opacity:.18}.pv-line{fill:none;stroke:var(--pv-drive);stroke-width:2}.pv-was-curve{fill:none;stroke:var(--pv-muted);stroke-width:1.2;stroke-dasharray:2 3}.pv-mark{stroke:var(--pv-text);stroke-dasharray:2 2}.pv-case-band{fill:transparent}.pv-case-band.pv-current{fill:var(--pv-panel);stroke:var(--pv-rule)}</style><defs><pattern id="pvh0" width="5" height="5" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="2" height="5" class="pv-hatch"/></pattern></defs><text x="14" y="18" class="pv-title">After reading 0 at 50 µs</text><g class="pv-curve"><path d="M 132 134 H 746" cla