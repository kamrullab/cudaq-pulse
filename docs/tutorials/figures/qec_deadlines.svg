<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="583.373" height="244.587" aria-labelledby="title desc" role="img" version="1.1" viewBox="0 0 437.53 183.44"><title id="title">Waiting for the decoder against decay</title><desc id="desc">Two curves against the decoding deadline, from 1 to 80 microseconds, simulated with the decoder&apos;s 62 microsecond nominal and 75 microsecond maximum latency. The share of shots that use the decoder&apos;s answer rises from 0 at 1 microsecond through 0.54 at 50 to 1 at the maximum. The share whose data qubits end back in 000 falls from 0.883 at 1 microsecond to 0.285 at 80, because the qubits decay while they wait.</desc><defs><style type="text/css">*{stroke-linejoin:round;stroke-linecap:butt}</style></defs><g id="figure_1"><g id="patch_1"><path d="M 0 183.44 L 437.53 183.44 L 437.53 0 L 0 0 L 0 183.44 z" style="fill:none"/></g><g id="axes_1"><g id="patch_2"><path d="M 32.89 152.56 L 434.65 152.56 L 434.65 2.88 L 32.89 2.88 L 32.89 152.56 z" style="fill:none"/></g><g id="matplotlib.axis_1"><g id="xtick_1"><g id="line2d_1"><defs><path id="m5b935c8b90" d="M 0 0 L 0 3" style="stroke:#b8bdc2;stroke-width:.8"/></defs><g><use x="32.89" y="152.56" xlink:href="#m5b935c8b90" style="fill:#b8bdc2;stroke:#b8bdc2;stroke-width:.8"/></g></g><g id="text_1"><text style="font-size:8.5px;font-family:NVIDIA,Arial,Helvetica,sans-serif;text-anchor:middle;fill:#5c636a" x="32.89" y="165.52" transform="rotate(-0 32.89 165.52)">0</text></g></g><g id="xtick_2"><g id="line2d_2"><g><use x="81.89" y="152.56" xlink:href="#m5b935c8b90" style="fill:#b8bdc2;stroke:#b8bdc2;stroke-width:.8"/></g></g><g id="text_2"><text style="font-size:8.5px;font-family:NVIDIA,Arial,Helvetica,sans-serif;text-anchor:middle;fill:#5c636a" x="81.89" y="165.52" transform="rotate(-0 81.89 165.52)">10</text></g></g><g id="xtick_3"><g id="line2d_3"><g><use x="130.88" y="152.56" xlink:href="#m5b935c8b90" style="fill:#b8bdc2;stroke:#b8bdc2;stroke-width